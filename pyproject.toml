[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truthgate"
version = "1.0.1"
description = "Deterministic Physical Gatekeeper, Dual External Reviewer (Agnes + OmniRoute DeepSeek-V4.1-Flash Fallback), and 4-Platform Alignment Guard for AI Coding Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Frank & TruthGate Community", email = "user@example.com" }
]
keywords = [
    "truthgate",
    "jev",
    "awesome-jev",
    "typesafe-ai",
    "ai-safety",
    "coding-assistant",
    "claude-code",
    "cursor",
    "antigravity",
    "mcp-server",
    "model-context-protocol",
    "guardrails",
    "proof-of-work",
    "vibe-coding",
    "action-contract",
    "anti-hallucination",
    "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.1.0"]
all = ["truthgate[jev]"]

[project.urls]
Homepage = "https://github.com/satangel2222/truthgate"
Documentation = "https://github.com/satangel2222/truthgate#readme"
Repository = "https://github.com/satangel2222/truthgate.git"
Issues = "https://github.com/satangel2222/truthgate/issues"
Changelog = "https://github.com/satangel2222/truthgate/releases"

[project.scripts]
truthgate = "truthgate.cli:main"
tg = "truthgate.cli:main"
superego = "truthgate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["truthgate*", "superego*"]

[tool.setuptools.package-data]
truthgate = ["*.html", "*.md", "rulepacks/*.json", "mcp/*", "hooks/*.py", "exam/**/*", "harness/*"]
superego = ["*.html", "*.md", "rulepacks/*.json", "mcp/*"]
